[build]
  publish = "client"
  # Substitutes __SUPABASE_URL__ and __SUPABASE_ANON_KEY__ placeholders in
  # config.js with the real values from Netlify environment variables.
  # Set SUPABASE_URL and SUPABASE_ANON_KEY in:
  #   Netlify Dashboard → Site Settings → Build & Deploy → Environment Variables
  command = """
    sed -i \
      -e 's|__SUPABASE_URL__|'"$SUPABASE_URL"'|g' \
      -e 's|__SUPABASE_ANON_KEY__|'"$SUPABASE_ANON_KEY"'|g' \
      client/config.js
  """

# ============================================================
# Security Headers (applied to all routes)
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com unpkg.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com; font-src 'self' fonts.gstatic.com cdn.jsdelivr.net; img-src 'self' data: blob: *.supabase.co *.supabase.io openstreetmap.org *.openstreetmap.org *.tile.openstreetmap.org; connect-src 'self' *.supabase.co *.supabase.io wss://*.supabase.co overpass-api.de nominatim.openstreetmap.org api.openai.com; worker-src 'self';"

# No-cache for config files (allows key rotation without stale SW serving old config)
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# SPA fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
